name: Build ELF

on:
  workflow_dispatch:
  push:
    branches: [main, master, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            clang-18 \
            lld-18 \
            make \
            python3 \
            python3-pyelftools \
            wget \
            xz-utils \
            pkg-config \
            sudo \
            unzip \
            librsvg2-bin

      - name: Set up Clang 18 as default
        run: |
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld

      - name: Clone submodules manually
        run: |
          # Submodules are uploaded as regular files in the repo;
          # git submodule update fails, so we clone them at the pinned commits.
          git clone https://github.com/itsPLK/ps5-unified-autoloader.git third_party/ps5-unified-autoloader
          git -C third_party/ps5-unified-autoloader checkout 915a65e232e03e293829e34bca18866659b2bcf4
          git clone https://github.com/ntfargo/Relapse-Exploit.git third_party/relapse
          git -C third_party/relapse checkout d8e6896b5cb33b04f1e038a5d698d3d4aee5947c
          git clone https://github.com/itsPLK/slopkit.git third_party/slopkit
          git -C third_party/slopkit checkout e69a21762f8d12479443502ce19ea4a575295c48
          git clone https://github.com/idlesauce/umtx2.git third_party/umtx2
          git -C third_party/umtx2 checkout a080beb74d9e4bc34f3563798b716bd86b2d6ee0
          git clone https://github.com/itsPLK/ps5-elfldr.git third_party/ps5-elfldr
          git -C third_party/ps5-elfldr checkout bb1e117988217a0239679029601e93c7286394d7
          # ps5-unified-autoloader has a nested submodule
          git clone https://github.com/itsPLK/ps5-payload-manager.git third_party/ps5-unified-autoloader/third_party/ps5-payload-manager
          git -C third_party/ps5-unified-autoloader/third_party/ps5-payload-manager checkout e4e72dc9d831dd09ee8fabc222ad1e7f5139050e
          git clone https://github.com/itsPLK/ps5-payload-manager-translations.git third_party/ps5-unified-autoloader/third_party/ps5-payload-manager/frontend/src/locales
          git -C third_party/ps5-unified-autoloader/third_party/ps5-payload-manager/frontend/src/locales checkout 3796ce40906f8b6690ae66609b723d97ba677189

      - name: Build PS5 Payload SDK from source
        run: |
          export PATH="/opt/ps5-payload-sdk/bin:$PATH"
          git clone https://github.com/ps5-payload-dev/sdk.git /tmp/ps5-payload-sdk-source
          cd /tmp/ps5-payload-sdk-source
          make DESTDIR=/opt/ps5-payload-sdk install

      - name: Fix permissions
        run: |
          chmod +x tools/*.sh build_deps.sh build_release.sh 2>/dev/null || true
          find . -name "*.sh" -exec chmod +x {} \;

      - name: Fix CRLF line endings
        run: |
          find . -name "*.sh" | xargs sed -i 's/\r//'

      - name: Fix SVG defs for icon generation
        run: |
          # gen_icons.py expects icon.svg to have a <defs> block
          if ! grep -q '<defs>' assets/icon.svg; then
            sed -i 's|<svg[^>]*>|&\n  <defs></defs>|' assets/icon.svg
          fi

      - name: Build libmicrohttpd
        run: |
          export PATH="/opt/ps5-payload-sdk/bin:$PATH"
          chmod +x build_deps.sh
          ./build_deps.sh

      - name: Download payload dependency
        run: |
          chmod +x tools/download_deps.sh
          ./tools/download_deps.sh

      - name: Prepare exploit copies
        run: |
          # relapse / slopkit / umtx2 patched copies + check_exploit_js.
          chmod +x tools/*.sh
          make relapse-prepare slopkit-prepare umtx2-prepare

      - name: Test routing, message handoff and payload transfer
        run: node tests/relapse.test.cjs

      - name: Test compact UI
        run: node tests/relapse_ui.test.cjs

      - name: Test offline manifest and packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build ELF
        run: |
          export PATH="/opt/ps5-payload-sdk/bin:$PATH"
          make clean all

      - name: Rename ELF with version
        run: |
          VERSION=$(python3 tools/gen_version.py --print)
          if [ -f "installer.elf" ]; then
            mv installer.elf "webkit-autoloader-installer_v${VERSION}.elf"
            echo "Created: webkit-autoloader-installer_v${VERSION}.elf"
          else
            echo "Error: installer.elf not found after build!"
            exit 1
          fi

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: webkit-autoloader-installer
          path: webkit-autoloader-installer_v*.elf
          retention-days: 30
